version: '3.8'

services:
  carservice-api:
    build: .
    container_name: carservice-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/data/carservice.db
    volumes:
      - db-data:/data
    restart: unless-stopped

volumes:
  db-data:
